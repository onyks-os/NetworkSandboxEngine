[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-sandbox-engine"
version = "2.1.0"
description = "Headless Python engine for isolated network namespace testing and PCAP assertions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "onyks"},
]
keywords = ["networking", "namespace", "testing", "nftables", "pcap", "scapy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "scapy>=2.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cli = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # The suite exercises the YAML runner and validates the YAML in the docs, so
    # the parser is a dev dependency, not just a `[cli]` extra. Without it the
    # runner and docs tests fail to import rather than skipping.
    "pyyaml>=6.0",
    # The coverage ratchet in `make test-cov` is a gate, so the tool that
    # enforces it is a declared dependency and not something you happen to have.
    "pytest-cov>=5.0.0",
    "ruff",
    "import-linter",
    "mypy",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
nse-runner = "nse.cli.runner:main"

[project.urls]
Homepage = "https://github.com/onyks-os/NetworkSandboxEngine"
Repository = "https://github.com/onyks-os/NetworkSandboxEngine"
Issues = "https://github.com/onyks-os/NetworkSandboxEngine/issues"

[tool.setuptools.packages.find]
include = ["nse", "nse.*"]   # Packages ONLY the engine; tests/ are excluded.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: integration tests requiring root and real network namespaces",
]
# Fail on an unregistered marker: a typo in a marker name silently deselects
# the test it was meant to tag.
addopts = "--strict-markers"
filterwarnings = [
    "ignore:.*Diffie-Hellman over finite fields.*:Warning",
    "ignore:.*Diffie-Hellman over finite fields.*:DeprecationWarning",
    "ignore::UserWarning:scapy.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]
ignore = ["E501", "PT011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
