name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types, import boundaries
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Bootstrap Environment
      run: make setup

    # `make lint` runs ShellCheck and markdownlint when they are on PATH and
    # prints "skipping" when they are not, so on a bare runner two of the five
    # checks in the gate would quietly do nothing.
    - name: Install ShellCheck and markdownlint
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        npm install -g markdownlint-cli

    - name: Assert every linter is actually present
      run: |
        command -v shellcheck
        command -v markdownlint

    - name: Run every linter (Ruff, mypy, import-linter, ShellCheck, markdownlint)
      run: make lint

  unit:
    name: Unit tests + coverage ratchet (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Bootstrap Environment
      run: make setup

    # The floor lives in the Makefile so `make verify` locally and CI cannot
    # disagree about what "covered enough" means.
    - name: Run unit tests with the coverage ratchet
      run: make coverage

  runtime-compatibility:
    name: Runtime compatibility (${{ matrix.python-version }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            profile: pinned
          - python-version: '3.11'
            profile: pinned
          - python-version: '3.10'
            profile: scapy-minimum
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    # The ordinary unit job resolves pyproject.toml, so it cannot detect an
    # incompatible pair of exact pins introduced only in requirements.txt.
    - name: Install the pinned runtime and development tools together
      if: matrix.profile == 'pinned'
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install -r requirements.txt -e ".[dev]"

    - name: Install the minimum supported Scapy
      if: matrix.profile == 'scapy-minimum'
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install -e ".[dev]" "scapy==2.5.0"

    - name: Verify installed dependencies and run the suite
      run: |
        .venv/bin/python -m pip check
        .venv/bin/python -m pip freeze
        make coverage

  integration:
    # The trace parser has broken across nftables releases before, and a broken
    # parser is a *silent* failure: it stops seeing rather than erroring. So the
    # privileged suite runs on more than one runner image, which means more than
    # one kernel and nftables version.
    name: Oracle integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables iproute2 conntrack

    - name: Record the environment under test
      run: |
        uname -r
        nft --version
        ip -V

    - name: Bootstrap Environment
      run: make setup

    # The pytest marker selects tests; it does not grant root. Fail explicitly
    # if privilege elevation fails, rather than passing a suite of skipped tests.
    #
    # The suite runs in its own empty network namespace (scripts/isolated-netns.sh).
    # Some runner hosts route part of 10.0.0.0/24, NSE's default subnet, to their
    # NIC, and NSE correctly refuses a topology that would shadow a host route.
    # The namespace keeps the runner's network out of the experiment and the
    # experiment's traffic off the runner's network.
    - name: Run privileged oracle and resource lifecycle integration tests
      run: |
        sudo -E .venv/bin/python -c 'import os; assert os.geteuid() == 0'
        sudo -E bash scripts/isolated-netns.sh .venv/bin/python -m pytest tests -v -m integration

    # The documented YAML suite through the CLI, with its experiment report kept
    # as an artifact: input, environment, observations and limits of each case,
    # plus a SHA-256 manifest. Uploaded even when the suite fails.
    - name: Run the YAML suite with a JSON report
      run: >-
        sudo -E bash scripts/isolated-netns.sh
        .venv/bin/nse-runner --file tests/test_suite.yaml --report-dir nse-report

    - name: Upload the experiment report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nse-report-${{ matrix.os }}
        path: nse-report/
        if-no-files-found: error

  blindness:
    # The meta-test. NSE_FORCE_BLIND makes the parser understand nothing, which
    # is what a kernel format change looks like from the outside. The suite must
    # FAIL. Before the canary probes existed it passed, which is precisely the
    # defect this job exists to prevent from coming back.
    name: A blind oracle must fail the suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables iproute2 conntrack

    - name: Bootstrap Environment
      run: make setup

    # In its own network namespace, for the reason given in the integration job.
    - name: Assert a blind parser fails the run
      run: sudo -E bash scripts/isolated-netns.sh make test-blind

  smoke-pypi:
    name: Package installs and imports
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Test Editable Install & Imports
      run: |
        python -m venv .smoke_venv
        source .smoke_venv/bin/activate
        pip install -e ".[cli]"
        python -c "import nse; from nse.core.pipeline import run_test_pipeline; print('Smoke PyPI OK')"
        nse-runner --help
