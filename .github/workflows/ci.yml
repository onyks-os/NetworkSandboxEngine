name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types, import boundaries
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Bootstrap Environment
      run: make setup

    # `make lint` runs ShellCheck and markdownlint when they are on PATH and
    # prints "skipping" when they are not, so on a bare runner two of the five
    # checks in the gate would quietly do nothing.
    - name: Install ShellCheck and markdownlint
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        npm install -g markdownlint-cli

    - name: Assert every linter is actually present
      run: |
        command -v shellcheck
        command -v markdownlint

    - name: Run every linter (Ruff, mypy, import-linter, ShellCheck, markdownlint)
      run: make lint

  unit:
    name: Unit tests + coverage ratchet (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Bootstrap Environment
      run: make setup

    # The floor lives in the Makefile so `make verify` locally and CI cannot
    # disagree about what "covered enough" means.
    - name: Run unit tests with the coverage ratchet
      run: make coverage

  integration:
    # The trace parser has broken across nftables releases before, and a broken
    # parser is a *silent* failure: it stops seeing rather than erroring. So the
    # privileged suite runs on more than one runner image, which means more than
    # one kernel and nftables version.
    name: Oracle integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables iproute2 conntrack

    - name: Record the environment under test
      run: |
        uname -r
        nft --version
        ip -V

    - name: Bootstrap Environment
      run: make setup

    # Includes test_parser_understands_every_line_of_a_real_trace, which fails
    # if this kernel emits a trace format the parser does not understand.
    - name: Run privileged oracle integration tests
      run: make integration-test

  blindness:
    # The meta-test. NSE_FORCE_BLIND makes the parser understand nothing, which
    # is what a kernel format change looks like from the outside. The suite must
    # FAIL. Before the canary probes existed it passed, which is precisely the
    # defect this job exists to prevent from coming back.
    name: A blind oracle must fail the suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nftables iproute2 conntrack

    - name: Bootstrap Environment
      run: make setup

    - name: Assert a blind parser fails the run
      run: make test-blind

  smoke-pypi:
    name: Package installs and imports
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Test Editable Install & Imports
      run: |
        python -m venv .smoke_venv
        source .smoke_venv/bin/activate
        pip install -e ".[cli]"
        python -c "import nse; from nse.core.pipeline import run_test_pipeline; print('Smoke PyPI OK')"
        nse-runner --help
