version: 2
updates:
  # Keep GitHub Actions pinned references fresh. Required for a good
  # OpenSSF Scorecard "Pinned-Dependencies" and "Dependency-Update-Tool" score.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
    groups:
      # Pydantic pins an exact pydantic-core version. Updating either pin alone
      # can leave requirements.txt impossible to install.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
      dev-dependencies:
        dependency-type: "development"
