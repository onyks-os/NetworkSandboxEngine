# A NAT gateway: the router forwards DNS and HTTP from the client network to the
# server network, masquerades it, and drops everything else. Verdicts are
# attributed from the first hook, before translation, so the rewritten source
# address does not hide which stimulus a trace belongs to.
#
#   sudo nse-runner --file examples/gateway_nat.yaml
#
# Expected: 1 passed, 0 failed, exit code 0. The rules are loaded in the router
# namespace; the listeners run in the server namespace.
tests:
  - name: "NAT gateway: forward and masquerade DNS and HTTP, drop SSH"
    topology: gateway
    rules: |
      table ip gateway {
        chain forward {
          type filter hook forward priority 0; policy drop;
          ct state established,related accept
          ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 udp dport 53 accept
          ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 80 accept
        }
        chain postrouting {
          type nat hook postrouting priority 100; policy accept;
          ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 masquerade
        }
      }
    packets:
      - {protocol: udp, src_ip: 10.0.1.1, dst_ip: 10.0.2.2, dst_port: 53, expected_verdict: ACCEPT}
      - {protocol: tcp, src_ip: 10.0.1.1, dst_ip: 10.0.2.2, dst_port: 80, expected_verdict: ACCEPT}
      - {protocol: tcp, src_ip: 10.0.1.1, dst_ip: 10.0.2.2, dst_port: 22, expected_verdict: DROP}
